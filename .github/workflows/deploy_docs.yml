name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:          
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Cache Quartz node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
            path: quartz/node_modules
            key: quartz-node-modules-${{ runner.os }}-${{ hashFiles('quartz/package-lock.json') }}

      - name: Install Quartz dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: quartz
        run: npm ci

      - name: Install Quartz plugins
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: quartz
        run: npx quartz plugin install --from-config
      
      - name: Build documentation
        working-directory: quartz
        run: npx quartz build --directory ../docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4