name: {{PROJECT_NAME}}

on:
  push:
    branches:
      # replace this with main, when yaml is correct
      - __never__
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  BUILD_VERSION: "0.1.${{ github.run_number }}"

jobs:

  build:
    name: Build
    runs-on: windows-latest  

    steps:
     
    # setup
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 10.0.x

    - name: Install NuGet
      uses: NuGet/setup-nuget@v1.0.5

    # Install docFX
    - name: Install DocFX
      run: dotnet tool install -g docfx

    # - name: Echo Version 
    #  run: echo "Version = ${{ env.BUILD_VERSION }}"
    
    - name: Version Visual Studio SDK projects
      uses: roryprimrose/set-vs-sdk-project-version@v1.0.3
      with:
        version: "${{ env.BUILD_VERSION }}.0"
        assemblyVersion: "${{ env.BUILD_VERSION }}.0"
        fileVersion: "${{ env.BUILD_VERSION }}.0"
        informationalVersion: "${{ env.BUILD_VERSION }}.0"
    
    # Compile the solution
    - name: Compile solution
      run: dotnet build src\{{PROJECT_NAME}}.slnx -c Release -output

    # Test?
    
    # Documentation

    - name: Build Documentation
      working-directory: docfx_project
      run: docfx docfx.json
      continue-on-error: false

    - name: Remove unnecessary files
      run: del output\*.pdb,output\*.dev.json,output\*.deps.json 

    - name: Zip binaries
      uses: TheDoctor0/zip-release@0.6.2
      with:
        filename: '{{PROJECT_NAME}}.${{ env.BUILD_VERSION }}-binary.zip'
        directory: output
        path: '*.dll *.exe'
        type: 'zip'

    # create github release
    - name: Create Release
      uses: softprops/action-gh-release@v1        
      with:
        name: Release ${{ env.BUILD_VERSION }}
        tag_name: ${{ env.BUILD_VERSION }}
        files: |
          ./output/{{PROJECT_NAME}}.${{ env.BUILD_VERSION }}-binary.zip
          ./output/{{PROJECT_NAME}}.${{ env.BUILD_VERSION }}.nupkg      

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    # Push the package
    - name: NuGet push
      run: dotnet nuget push **\*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

    # publish documentation
    - name: Publish documentation
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docfx_project/docs
        force_orphan: true
